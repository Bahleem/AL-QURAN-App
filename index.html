<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08251d">
  <meta name="description" content="AL QURAN — Quran Recitation, Translation & Tafseer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo.png">
  <title>AL QURAN</title>
  <style>
    :root{
      --bg:#071b15;--panel:#0d2a21;--panel2:#12352a;--gold:#e4bd62;
      --cream:#f6f0df;--muted:#b9c7c0;--line:rgba(228,189,98,.25);
      --shadow:0 12px 35px rgba(0,0,0,.25)
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:linear-gradient(180deg,#061812,#0a2119 45%,#071a14);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{min-height:100vh;padding-bottom:88px}
    button,input{font:inherit}
    button{cursor:pointer}
    .top{position:sticky;top:0;z-index:20;background:rgba(7,27,21,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topin{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
    .mini-logo{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
    .brand{line-height:1.05}.brand b{font-size:20px;letter-spacing:2px}.brand small{display:block;color:var(--gold);font-size:10px;letter-spacing:.8px;margin-top:5px}
    main{max-width:900px;margin:auto;padding:18px 16px}
    .hero{background:radial-gradient(circle at 50% 0,rgba(228,189,98,.13),transparent 55%),linear-gradient(145deg,#103a2d,#0b261e);border:1px solid var(--line);border-radius:28px;padding:24px 18px;text-align:center;box-shadow:var(--shadow)}
    .hero img{width:118px;height:118px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.35)}
    .hero h1{margin:14px 0 5px;font-size:28px;letter-spacing:3px}.hero p{margin:0;color:var(--muted)}
    .gold{color:var(--gold)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
    .card{background:linear-gradient(150deg,#10382c,#0c2920);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:112px;box-shadow:var(--shadow);transition:.15s}
    .card:active{transform:scale(.98)} .ico{font-size:25px}.card b{display:block;margin-top:10px;font-size:16px}.card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .section{display:none}.section.active{display:block}
    .back{border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:12px;padding:9px 13px;margin-bottom:14px}
    .title{display:flex;align-items:center;justify-content:space-between;gap:10px}.title h2{margin:0 0 14px}
    .search{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#071c16;color:var(--cream);outline:none;margin-bottom:12px}
    .surah{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);background:#0b281f;border-radius:16px;margin:8px 0}
    .num{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:12px;color:var(--gold);font-weight:700}
    .surah .en{font-weight:700}.surah .sub{font-size:12px;color:var(--muted);margin-top:3px}.arabic{margin-left:auto;font-family:serif;font-size:22px;color:var(--gold)}
    .ayah{border:1px solid var(--line);background:#0b281f;border-radius:18px;padding:18px;margin:12px 0}
    .ayahno{color:var(--gold);font-size:12px}.arabicbig{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:29px;line-height:2.1;margin:10px 0}
    .trans{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;color:#e7eee9;line-height:1.6}.ur{direction:rtl;text-align:right}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.pill{border:1px solid var(--line);background:#10372b;color:var(--cream);border-radius:999px;padding:8px 12px}
    .name{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);background:#0b281f;border-radius:16px;margin:8px 0}.name .n{font-size:26px;color:var(--gold);font-family:serif}.name b{display:block}.name small{color:var(--muted)}
    .empty{text-align:center;color:var(--muted);padding:40px 15px}
    .yt{display:block;text-decoration:none;color:var(--cream);padding:18px;border-radius:18px;background:linear-gradient(145deg,#10382c,#0b251d);border:1px solid var(--line);margin-top:14px}
    .bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(6,24,18,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
    .nav{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
    .nav button{background:none;border:0;color:var(--muted);padding:7px 2px;font-size:11px}.nav button.active{color:var(--gold)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
    .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#e4bd62;color:#071b15;padding:10px 14px;border-radius:999px;font-weight:700;display:none;z-index:50}
    @media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<header class="top">
  <div class="topin">
    <img class="mini-logo" src="assets/logo.png" alt="AL QURAN logo">
    <div class="brand"><b>AL QURAN</b><small>RECITATION • TRANSLATION • TAFSEER</small></div>
  </div>
</header>

<main>
  <section id="home" class="section active">
    <div class="hero">
      <img src="assets/logo.png" alt="AL QURAN">
      <h1>AL QURAN</h1>
      <p>Recitation • Translation • Tafseer</p>
      <p style="margin-top:12px">Connect your heart with the words of Allah.</p>
    </div>
    <div class="grid">
      <button class="card" onclick="show('quran')"><div class="ico">📖</div><b>Quran</b><span>Read all 114 Surahs</span></button>
      <button class="card" onclick="show('names')"><div class="ico">🤲</div><b>99 Names</b><span>Names of Allah & meanings</span></button>
      <button class="card" onclick="daily()"><div class="ico">📅</div><b>Daily Ayat</b><span>A reminder for your day</span></button>
      <button class="card" onclick="show('favorites')"><div class="ico">❤️</div><b>Favorites</b><span>Your saved Ayahs</span></button>
    </div>
    <a class="yt" href="https://www.youtube.com/@bahleemzulqernain5931" target="_blank">▶️ <b>YouTube Channel</b><br><small>Watch AL QURAN recitation & translation Shorts</small></a>
  </section>

  <section id="quran" class="section">
    <button class="back" onclick="show('home')">← Home</button>
    <div class="title"><h2>📖 Quran</h2><span class="gold">114 Surahs</span></div>
    <input id="search" class="search" placeholder="Search Surah..." oninput="filterSurahs()">
    <div id="surahList"></div>
  </section>

  <section id="reader" class="section">
    <button class="back" onclick="show('quran')">← Surah List</button>
    <div id="readerTitle"></div>
    <div id="ayahs"></div>
  </section>

  <section id="names" class="section">
    <button class="back" onclick="show('home')">← Home</button>
    <div class="title"><h2>🤲 99 Names of Allah</h2></div>
    <div id="namesList"></div>
  </section>

  <section id="favorites" class="section">
    <button class="back" onclick="show('home')">← Home</button>
    <h2>❤️ Favorites</h2>
    <div id="favList"></div>
  </section>

  <section id="daily" class="section">
    <button class="back" onclick="show('home')">← Home</button>
    <h2>📅 Daily Ayat</h2>
    <div id="dailyBox"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<footer class="bottom">
  <div class="nav">
    <button id="n-home" class="active" onclick="show('home')"><i>⌂</i>Home</button>
    <button id="n-quran" onclick="show('quran')"><i>📖</i>Quran</button>

    <button id="n-favorites" onclick="show('favorites')"><i>♥</i>Saved</button>
  </div>
</footer>

function show(id){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  const n=document.getElementById('n-'+id); if(n)n.classList.add('active');
  window.scrollTo(0,0);
  if(id==='quran') renderSurahs(surahs);
  if(id==='names') renderNames();
  if(id==='favorites') renderFavorites();
}
function renderSurahs(list){
  document.getElementById('surahList').innerHTML=list.map(s=>`
    <button class="surah" onclick="openSurah(${s[0]})">
      <div class="num">${s[0]}</div><div style="text-align:left"><div class="en">${s[1]}</div><div class="sub">${s[3]}</div></div>
      <div class="arabic">${s[2]}</div>
    </button>`).join('');
}
function filterSurahs(){
  const q=document.getElementById('search').value.toLowerCase();
  renderSurahs(surahs.filter(s=>s.join(' ').toLowerCase().includes(q)));
}

  show('reader');
  const s=surahs[id-1];
  document.getElementById('readerTitle').innerHTML=`<h2>${s[1]} <span class="gold">• ${s[2]}</span></h2><p style="color:var(--muted)">${s[3]} • Surah ${id}</p>`;
  document.getElementById('ayahs').innerHTML='<div class="empty">Loading Quran text and translations…<br><small>Internet is required for the first load.</small></div>';
  try{
    const r=await fetch(`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,ur.jalandhry,en.asad`);
    if(!r.ok) throw new Error('API');
    const j=await r.json();
    const [ar,ur,en]=j.data;
    const rows=ar.ayahs.map((a,i)=>({
      no:a.numberInSurah, arabic:a.text,
      ur:ur.ayahs[i]?.text||'', en:en.ayahs[i]?.text||''
    }));
    document.getElementById('ayahs').innerHTML=rows.map(a=>`
      <article class="ayah">
        <div class="ayahno">AYAH ${a.no}</div>
        <div class="arabicbig">${a.arabic}</div>
        <div class="trans ur"><b>اردو:</b> ${a.ur}</div>
        <div class="trans"><b>English:</b> ${a.en}</div>
        <div class="actions">
          <button class="pill" onclick='saveFav(${JSON.stringify({surah:id,no:a.no,arabic:a.arabic,ur:a.ur,en:a.en})})'>♡ Save</button>
          <button class="pill" onclick='speak(${JSON.stringify(a.arabic)})'>🔊 Listen</button>
          <button class="pill" onclick='shareAyah(${JSON.stringify({surah:s[1],no:a.no,arabic:a.arabic})})'>📤 Share</button>
        </div>
      </article>`).join('');
  }catch(e){
    document.getElementById('ayahs').innerHTML=`<div class="empty">Quran data could not be loaded right now.<br>Please check your internet connection and try again.</div>`;
  }
}
function speak(t){ if('speechSynthesis' in window){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)} else toast('Audio playback is not supported here.'); }
function shareAyah(a){const t=`${a.surah} — Ayah ${a.no}\n${a.arabic}\n\nAL QURAN • Recitation | Translation | Tafseer`; if(navigator.share) navigator.share({title:'AL QURAN',text:t}); else navigator.clipboard?.writeText(t).then(()=>toast('Ayah copied')); }
function saveFav(a){let f=JSON.parse(localStorage.getItem('favs')||'[]');const key=a.surah+'-'+a.no;if(!f.some(x=>x.surah+'-'+x.no===key)){f.push(a);localStorage.setItem('favs',JSON.stringify(f));toast('Saved to Favorites')}else toast('Already saved');}
function renderFavorites(){let f=JSON.parse(localStorage.getItem('favs')||'[]');document.getElementById('favList').innerHTML=f.length?f.map((a,i)=>`<article class="ayah"><div class="ayahno">SURAH ${a.surah} • AYAH ${a.no}</div><div class="arabicbig">${a.arabic}</div><div class="trans ur">${a.ur}</div><div class="trans">${a.en}</div><div class="actions"><button class="pill" onclick="removeFav(${i})">Remove</button></div></article>`).join(''):'<div class="empty">No saved Ayahs yet.</div>'}
function removeFav(i){let f=JSON.parse(localStorage.getItem('favs')||'[]');f.splice(i,1);localStorage.setItem('favs',JSON.stringify(f));renderFavorites()}
function renderNames(){document.getElementById('namesList').innerHTML=names.map((n,i)=>`<div class="name"><div class="num">${i+1}</div><div><div class="n">${n[0]}</div><b>${n[1]}</b><small>${n[2]}</small></div></div>`).join('')}
function daily(){show('daily');const d=new Date().getDate();const picks=[["Al-Kawthar","إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","Indeed, We have granted you abundance."],["Al-Ikhlas","قُلْ هُوَ اللَّهُ أَحَدٌ","Say: He is Allah, One."],["Al-Falaq","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","Say: I seek refuge in the Lord of daybreak."],["An-Nas","قُلْ أَعُوذُ بِرَبِّ النَّاسِ","Say: I seek refuge in the Lord of mankind."]];const p=picks[d%picks.length];document.getElementById('dailyBox').innerHTML=`<article class="ayah"><div class="gold">${p[0]}</div><div class="arabicbig">${p[1]}</div><div class="trans">${p[2]}</div><div class="actions"><button class="pill" onclick="shareAyah({surah:'${p[0]}',no:1,arabic:${JSON.stringify(p[1])}})">📤 Share</button></div></article><p style="color:var(--muted);text-align:center">A small daily reminder from AL QURAN.</p>`}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
renderSurahs(surahs);renderNames();daily();
</script>
</body>
</html>
